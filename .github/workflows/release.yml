name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar dependências de sistema (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libxdo-dev \
            libssl-dev \
            pkg-config \
            build-essential \
            curl \
            wget \
            file

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Configurar Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de build do Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Instalar dependências do frontend
        run: npm ci

      - name: Compilar e gerar pacotes Tauri (e publicar Release em tags)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: "YouTube Music (Low-RAM) ${{ github.ref_name }}"
          releaseBody: |
            Instaladores multiplataforma gerados automaticamente pelo GitHub Actions.

            ### Linux
            - **`.AppImage`**: executável portátil (`chmod +x` e executar).
            - **`.deb`**: Ubuntu, Debian, Linux Mint, Pop!_OS (`sudo apt install ./arquivo.deb`).
            - **`.rpm`**: Fedora, openSUSE, RHEL.

            ### Windows
            - **`.exe` (NSIS)** ou **`.msi`**: instalador padrão para Windows 10/11.

            ### macOS
            - **`.dmg`**: imagem de disco para Apple Silicon (arraste para Aplicativos).
          releaseDraft: false
          prerelease: false

      - name: Anexar pacotes como Artifact (execução manual sem tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: youtube-music-low-ram-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
